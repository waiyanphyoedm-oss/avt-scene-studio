<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVT Scene Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Padauk', sans-serif; background-color: #f4f5f8; }
        .glass-dark { background: #1a1c23; border: 1px solid #2d303b; }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-[#1a1c23] text-white px-4 py-3 flex justify-between items-center text-sm">
        <div class="flex items-center space-x-2">
            <div class="bg-yellow-400 text-black font-bold px-2 py-1 rounded text-xs">AVT</div>
            <span class="font-bold text-lg">Scene Studio</span>
        </div>
        <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded border border-gray-600 transition">AI ချိတ်ဆက်ရန်</button>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">သင့်စိတ်ကူးကို စတင်ပုံဖော်ပါ</h1>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">Google AI Studio မှ ရယူထားသော API Key ကို ထည့်ပါ <span class="text-red-500">*</span></label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-yellow-400 outline-none transition">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
                    <h2 class="text-2xl font-bold mb-6">ဇာတ်လမ်းကနေ စမယ်</h2>
                    
                    <div class="mb-8">
                        <label class="block font-bold text-gray-800 mb-2">သင့်ဇာတ်လမ်းအကျဉ်း <span class="text-red-500">*</span></label>
                        <textarea id="storyBrief" rows="5" class="w-full border border-gray-300 rounded-lg p-4 focus:ring-2 focus:ring-yellow-400 outline-none"></textarea>
                    </div>

                    <button onclick="generateStory()" id="generateBtn" class="w-full py-4 px-6 bg-[#facc15] hover:bg-[#eab308] rounded-lg font-bold text-gray-900 transition shadow-sm">
                        ခေါင်းစဉ် ၅ မျိုး ထုတ်မယ် ✦
                    </button>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="glass-dark rounded-xl p-6 sticky top-6">
                    <span class="text-yellow-500 font-bold text-sm block mb-4">PRODUCTION BRIEF</span>
                    <div id="aiOutputArea">
                        <h4 class="text-yellow-400 font-bold mb-3">AI ရလဒ်များ:</h4>
                        <div id="loading" class="hidden text-gray-400 text-sm">AI စဉ်းစားနေပါသည်... ခဏစောင့်ပါ။</div>
                        <div id="output" class="text-gray-200 text-sm whitespace-pre-wrap leading-relaxed">ဇာတ်လမ်းအကျဉ်းရေးပြီး "ခေါင်းစဉ် ၅ မျိုး ထုတ်မယ်" ကို နှိပ်ပါ။</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Catch any hidden errors on Tablet
        window.onerror = function(msg, url, line) {
            alert("စနစ်ချို့ယွင်းချက် (System Error): " + msg + " (Line: " + line + ")");
        };

        async function generateStory() {
            const btn = document.getElementById('generateBtn');
            const output = document.getElementById('output');
            const loading = document.getElementById('loading');

            try {
                const apiKey = document.getElementById('apiKey').value.trim();
                const brief = document.getElementById('storyBrief').value.trim();
                
                if (!apiKey) {
                    alert("ကျေးဇူးပြု၍ API Key အရင်ထည့်ပါ။");
                    return;
                }
                if (!brief) {
                    alert("ကျေးဇူးပြု၍ ဇာတ်လမ်းအကျဉ်း ရေးပါ။");
                    return;
                }

                // Update UI to show loading
                btn.disabled = true;
                btn.innerText = 'ထုတ်လုပ်နေသည်... ခဏစောင့်ပါ';
                loading.classList.remove('hidden');
                output.innerText = "";
                output.classList.remove("text-red-400");

                const prompt = `အောက်ပါ ဇာတ်လမ်းအကျဉ်းကို အခြေခံပြီး ဇာတ်လမ်းခေါင်းစဉ် ၅ မျိုးကို မြန်မာဘာသာဖြင့် ဖန်တီးပေးပါ။ \nဇာတ်လမ်းအကျဉ်း: ${brief}\n\nခေါင်းစဉ် ၅ ခုကို (၁) (၂) စသဖြင့် အစဉ်လိုက်ရေးပေးပါ။`;
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "API Key မှားနေသည် (သို့) Limit ပြည့်သွားပါသည်။");
                }

                const data = await response.json();
                output.innerText = data.candidates[0].content.parts[0].text;

            } catch (error) {
                alert("Error ဖြစ်သွားပါသည်: " + error.message);
                output.innerText = "Error: " + error.message;
                output.classList.add("text-red-400");
            } finally {
                btn.disabled = false;
                btn.innerText = 'ခေါင်းစဉ် ၅ မျိုး ထုတ်မယ် ✦';
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
